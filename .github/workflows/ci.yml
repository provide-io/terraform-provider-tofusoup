# Python source quality gate (format/lint/typecheck) for this repo, run via wrknv
# so CI matches local `we run <task>` commands exactly. Runs independently of the
# provider packaging/release pipeline (build-provider.yml / test-conformance.yml /
# release.yml) — does not build, sign, or touch the Terraform provider binary.
#
# The pytest suite runs here. tests/ holds 280 tests that import the provider
# classes directly and need neither a built binary nor an engine, so nothing in
# this workflow depends on the packaging pipeline.
name: ⚙️ Continuous Integration

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: provide-io/ci-tooling/.github/workflows/python-ci.yml@v0
    with:
      python-version: '3.11'
      use-wrknv: true
      # Windows amd64 is where this org's platform bugs land -- a scrubbed
      # environment a process cannot start in, ntpath.expanduser ignoring HOME,
      # a TCP-only transport default -- and none is reachable from linux or
      # macos. arm64 stays off: it has no grpcio or cryptography wheels.
      include-windows: true
      # Coverage is not enforced yet; the tests running at all is the change.
      coverage-threshold: 0
      run-security: true
      # A known vulnerability in the lock reddens this build rather
      # than filing a report nobody reads. The lock is clean: 197
      # packages, no advisories.
      fail-on-vulnerability: true
      # cryptography is capped below 49 so the darwin_amd64 package can be
      # built at all -- see the note on the requirement in pyproject.toml, which
      # records why these three are unreachable from this closure. Only these
      # are waived; a fourth advisory still fails the build.
      ignore-vulnerabilities: 'PYSEC-2026-3552,PYSEC-2026-3553,PYSEC-2026-3554'
      run-secret-scan: true
    secrets: inherit
