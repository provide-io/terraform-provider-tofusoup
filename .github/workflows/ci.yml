# Python source quality gate (format/lint/typecheck) for this repo, run via wrknv
# so CI matches local `we run <task>` commands exactly. Runs independently of the
# provider packaging/release pipeline (build-provider.yml / test-conformance.yml /
# release.yml) — does not build, sign, or touch the Terraform provider binary.
#
# The pytest suite runs here. It used to be disabled with `run-tests: false` and
# the note "there is no repo-local pytest suite", which was copied from the
# pyvider provider and was never true of this repo: tests/ holds 280 tests that
# import the provider classes directly and need neither a built binary nor an
# engine.
name: ⚙️ Continuous Integration

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: provide-io/ci-tooling/.github/workflows/python-ci.yml@v0
    with:
      python-version: '3.11'
      use-wrknv: true
      # Coverage is not enforced yet; the tests running at all is the change.
      coverage-threshold: 0
      run-security: true
      run-secret-scan: true
    secrets: inherit
