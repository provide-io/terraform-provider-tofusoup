name: 🧪 Provider Conformance Tests

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: 'Build workflow run ID (leave empty for last successful build)'
        required: false
        type: string
      skip_bot:
        description: 'Skip running the bot (for manual testing)'
        required: false
        type: boolean
        default: false
  workflow_run:
    workflows: ["🏗️ Build Provider Binary"]
    types:
      - completed

env:
  PYTHON_VERSION: '3.11'
  PYTHONIOENCODING: utf-8

jobs:
  # Check if we should run tests (skip if workflow_run failed)
  check:
    name: 🔍 Check Build Status
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      build_run_id: ${{ steps.check.outputs.build_run_id }}
      skip_bot: ${{ steps.check.outputs.skip_bot }}

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Ensure gh CLI available
        shell: bash
        run: |
          if ! command -v gh >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq gh
          fi

      - name: 📋 Determine build run ID
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SKIP_BOT="${{ inputs.skip_bot }}"
          SHOULD_RUN="true"
          BUILD_RUN_ID=""

          if [[ "$SKIP_BOT" == "true" ]]; then
            echo "⏭️ Skipping bot as requested"
          fi

          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            BUILD_RUN_ID="${{ github.event.workflow_run.id }}"
            echo "✅ Running tests with artifacts from build workflow run: ${BUILD_RUN_ID}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            PROVIDED_RUN_ID="${{ inputs.build_run_id }}"

            if [[ -n "$PROVIDED_RUN_ID" ]]; then
              BUILD_RUN_ID="$PROVIDED_RUN_ID"
              echo "✅ Running tests with artifacts from specified build run: ${BUILD_RUN_ID}"
            else
              # Get last successful build using gh CLI
              RUN_LIST=$(gh run list \
                --workflow build-provider.yml \
                --status completed \
                --limit 1 \
                --json databaseId,conclusion)

              BUILD_RUN_ID=$(echo "$RUN_LIST" | jq '.[] | select(.conclusion=="success") | .databaseId')

              if [[ -n "$BUILD_RUN_ID" ]] && [[ "$BUILD_RUN_ID" != "null" ]]; then
                echo "✅ Using last successful build run: ${BUILD_RUN_ID}"
              else
                SHOULD_RUN="false"
                echo "❌ ERROR: No successful build found. Please run the Build Provider Binary workflow first."
              fi
            fi
          else
            SHOULD_RUN="false"
            echo "❌ ERROR: Unexpected event type"
          fi

          echo "should_run=${SHOULD_RUN}" >> $GITHUB_OUTPUT
          echo "build_run_id=${BUILD_RUN_ID}" >> $GITHUB_OUTPUT
          echo "skip_bot=${SKIP_BOT}" >> $GITHUB_OUTPUT

  conformance:
    name: 🧪 Test ${{ matrix.target }} (${{ matrix.engine }})
    needs: check
    if: needs.check.outputs.should_run == 'true'
    strategy:
      fail-fast: false
      matrix:
        # Both engines, every platform the build produces.
        #
        # The suite ran OpenTofu alone, so nothing verified this provider
        # against the engine most of its users run. linux_arm64 and
        # darwin_amd64 were built, zipped and released without ever being
        # tested; they are here now.
        #
        # windows_arm64 stays out, correctly: grpcio publishes no win_arm64
        # wheel (grpc/grpc#39064, still true at 1.83.1), so the provider cannot
        # be built for it.
        #
        # Written out rather than assembled by `fromJson`, which also carried a
        # one-combination branch for act. act can narrow a matrix itself with
        # `--matrix target:linux_amd64`, and a readable matrix is worth more
        # than a hardcoded shortcut for one runner.
        engine: [tofu, terraform]
        target: [linux_amd64, linux_arm64, darwin_arm64, darwin_amd64, windows_amd64]
        include:
          - target: linux_amd64
            os: ubuntu-24.04
            platform: linux
            arch: amd64
          - target: linux_arm64
            os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
          - target: darwin_arm64
            os: macos-15
            platform: darwin
            arch: arm64
          - target: darwin_amd64
            os: macos-15-intel
            platform: darwin
            arch: amd64
          - target: windows_amd64
            os: windows-2025
            platform: windows
            arch: amd64

    runs-on: ${{ matrix.os }}
    # No continue-on-error. Windows ran non-gating, so a Windows-only
    # regression reported success and shipped. It passes today -- every step of
    # the last Windows run, checked individually rather than by the job's own
    # conclusion, which continue-on-error makes meaningless.
    env:
      TF_BIN: ${{ matrix.engine }}

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📖 Read VERSION
        id: version
        shell: bash
        run: |
          VERSION=$(cat VERSION)
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "🧪 Testing version: ${VERSION}"

      - name: 📥 Download provider artifact
        uses: actions/download-artifact@v4
        with:
          name: provider-${{ matrix.target }}
          path: provider-binary
          run-id: ${{ needs.check.outputs.build_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}

      - name: 📦 Extract provider binary
        shell: bash
        run: |
          cd provider-binary
          echo "📦 Contents of provider-binary directory:"
          ls -la
          echo ""

          echo "📦 Extracting provider archive..."
          unzip terraform-provider-tofusoup_${{ steps.version.outputs.VERSION }}_${{ matrix.target }}.zip

          if [[ "${{ matrix.platform }}" == "windows" ]]; then
            BINARY="terraform-provider-tofusoup_v${{ steps.version.outputs.VERSION }}.exe"
          else
            BINARY="terraform-provider-tofusoup_v${{ steps.version.outputs.VERSION }}"
          fi
          chmod +x "$BINARY" 2>/dev/null || true

          echo ""
          echo "✅ Extracted provider binary:"
          ls -la "$BINARY"

      - name: 🔍 Verify provider binary
        shell: bash
        run: |
          if [[ "${{ matrix.platform }}" == "windows" ]]; then
            PROVIDER_BINARY="provider-binary/terraform-provider-tofusoup_v${{ steps.version.outputs.VERSION }}.exe"
          else
            PROVIDER_BINARY="provider-binary/terraform-provider-tofusoup_v${{ steps.version.outputs.VERSION }}"
          fi

          echo "════════════════════════════════════════════════════════════════"
          echo "🔍 PROVIDER BINARY VERIFICATION"
          echo "════════════════════════════════════════════════════════════════"

          echo "📋 Binary information:"
          ls -lah "$PROVIDER_BINARY"
          echo ""

          echo "📋 File type:"
          file "$PROVIDER_BINARY" 2>/dev/null || echo "file command not available"
          echo ""

          echo "📋 Testing provider executable (launch-context):"
          timeout 10 "$PROVIDER_BINARY" launch-context 2>&1 | head -10 || true
          echo "✅ Provider binary is valid"
          echo "════════════════════════════════════════════════════════════════"

      - name: 🔌 Install provider to Terraform plugin directory
        shell: bash
        run: |
          if [[ "${{ matrix.platform }}" == "windows" ]]; then
            SOURCE="provider-binary/terraform-provider-tofusoup_v${{ steps.version.outputs.VERSION }}.exe"
          else
            SOURCE="provider-binary/terraform-provider-tofusoup_v${{ steps.version.outputs.VERSION }}"
          fi
          chmod +x .github/scripts/install-provider.sh
          .github/scripts/install-provider.sh \
            "${{ steps.version.outputs.VERSION }}" \
            "${{ matrix.target }}" \
            "$SOURCE"

      # `latest` for both, deliberately. An undated pin rots: 1.10.6 predated
      # write-only attributes and failed for a provider behaving exactly as
      # write-only requires. Examples that need a particular version say so in
      # their requirements sidecar, which is where a version floor belongs.
      #
      # The wrapper is off in both cases: it intercepts stdout, which stir
      # parses.
      - name: 📝 Install OpenTofu
        if: matrix.engine == 'tofu'
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: latest
          tofu_wrapper: false

      - name: 📝 Install Terraform
        if: matrix.engine == 'terraform'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: latest
          terraform_wrapper: false

      - name: 🐍 Setup Python
        if: env.ACT != 'true' && github.actor != 'nektos/act'
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Install UV
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57  # v8.0.0

      - name: 🍲 Install tofusoup
        shell: bash
        run: |
          uv tool install tofusoup
          echo "✅ Tofusoup installed"
          soup --version

      # These two were 100 lines of inline bash with `tofu` hard coded
      # throughout. They live in ci/conformance.sh now, which takes the engine
      # from TF_BIN -- one subcommand per step, so the CI UI still shows which
      # one failed.
      - name: "🔥 Smoke Test 1: Provider Initialization"
        shell: bash
        run: ci/conformance.sh smoke-init

      - name: "🔥 Smoke Test 2: Registry Query"
        shell: bash
        run: ci/conformance.sh smoke-registry

      - name: "🔬 Single Test Verification: provider_versions"
        id: single_test
        shell: bash
        env:
          TF_LOG: DEBUG
          PYVIDER_LOG_LEVEL: debug
        run: |
          chmod +x .github/scripts/single-test-verification.sh
          .github/scripts/single-test-verification.sh provider_versions "${{ matrix.target }}"

      # No continue-on-error. It made this step -- the one that runs every
      # example -- incapable of failing the build, and it also defeated the
      # summary job below: that reads `needs.conformance.result`, and a step
      # marked continue-on-error leaves the job's conclusion at "success", so
      # the summary's failure branch was unreachable. The stated intent,
      # "platforms run independently", is what `fail-fast: false` already does.
      - name: 🧪 Run Full Conformance Tests
        id: full_conformance
        if: success()
        shell: bash
        env:
          TF_LOG: DEBUG
          PYVIDER_LOG_LEVEL: debug
        run: |
          chmod +x .github/scripts/run-conformance-suite.sh
          .github/scripts/run-conformance-suite.sh "${{ matrix.target }}"

      # One leg records it: the artifact name is fixed, and four linux legs
      # (two targets x two engines) would race for it.
      - name: 🎬 Record conformance cast
        if: matrix.target == 'linux_amd64' && matrix.engine == 'tofu'
        shell: bash
        env:
          TF_LOG: DEBUG
          PYVIDER_LOG_LEVEL: debug
        run: |
          chmod +x ci/record-conformance.sh
          ci/record-conformance.sh

      - name: 📤 Upload conformance cast
        if: matrix.target == 'linux_amd64' && matrix.engine == 'tofu'
        uses: actions/upload-artifact@v4
        with:
          name: conformance-cast
          path: conformance.cast
          retention-days: 90
          if-no-files-found: error

      - name: 📤 Upload test logs and artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-test-logs-${{ matrix.target }}-${{ matrix.engine }}
          path: |
            /tmp/conformance_output.txt
            examples/**/.soup/logs/*.log
            examples/**/.soup/logs/terraform.log
            examples/**/.terraform.lock.hcl
            examples/**/terraform.tfstate*
            examples/**/crash.log
            examples/data-sources/provider_versions/.terraform/
            examples/data-sources/provider_versions/terraform.tfstate*
            examples/data-sources/provider_versions/.terraform.lock.hcl
            /tmp/smoke-test-init/.terraform/
            /tmp/smoke-test-init/terraform.tfstate*
            /tmp/smoke-test-init/.terraform.lock.hcl
            /tmp/smoke-test-registry/.terraform/
            /tmp/smoke-test-registry/terraform.tfstate*
            /tmp/smoke-test-registry/.terraform.lock.hcl
          # Most paths above are dot-paths -- .soup, .terraform,
          # .terraform.lock.hcl -- and upload-artifact skips hidden files
          # unless told otherwise, so this artifact has been missing the logs
          # it exists to carry.
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn

  summary:
    name: 📋 Test Summary
    needs: [check, conformance]
    if: always() && needs.check.outputs.should_run == 'true' && needs.check.outputs.skip_bot != 'true'
    runs-on: ubuntu-latest

    steps:
      - name: 📊 Generate Summary
        run: |
          # Check if bot was skipped
          if [[ "${{ needs.check.outputs.skip_bot }}" == "true" ]]; then
            echo "## 🧪 Provider Conformance Tests - Bot Skipped" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Tests ran in manual/skip-bot mode. Summary generation skipped per request." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          echo "## 🧪 Provider Conformance Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Create results table
          echo "| Platform | Status | Details |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|---------|" >> $GITHUB_STEP_SUMMARY

          CONFORMANCE_RESULT="${{ needs.conformance.result }}"

          if [[ "$CONFORMANCE_RESULT" == "success" ]]; then
            echo "| all targets x both engines | ✅ PASSED | All tests successful |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Test Coverage" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ **Smoke Test 1:** Provider initialization" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ **Smoke Test 2:** Registry query (tofusoup_provider_info)" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ **Single Test:** Full cycle on tofusoup_provider_versions" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ **Full Suite:** All 9 data source examples" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "🎉 All conformance tests passed successfully!" >> $GITHUB_STEP_SUMMARY
            exit 0
          else
            echo "| one or more legs | ❌ FAILED | See the per-leg job logs |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Failure Details" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Some tests failed. The workflow uses a **hybrid failure handling** approach:" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- **Platforms run independently** (fail-fast: false)" >> $GITHUB_STEP_SUMMARY
            echo "- **Single test acts as circuit breaker** - full suite skipped if it fails" >> $GITHUB_STEP_SUMMARY
            echo "- **Full suite failures fail the leg** (it used to be continue-on-error, which also made this summary's failure branch unreachable)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "#### Artifacts Available" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Download test artifacts for detailed logs:" >> $GITHUB_STEP_SUMMARY
            echo "- \`conformance-test-logs-<target>-<engine>\` - per-leg test logs and state files" >> $GITHUB_STEP_SUMMARY
            echo "- \`/tmp/conformance_output.txt\` - Soup stir full output with error details" >> $GITHUB_STEP_SUMMARY
            echo "- \`.soup/logs/\` - Individual test logs for each example" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "#### Next Steps" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "1. Check the job logs to see which step failed" >> $GITHUB_STEP_SUMMARY
            echo "2. Download artifacts to review detailed error messages" >> $GITHUB_STEP_SUMMARY
            echo "3. Look for \`conformance_output.txt\` for soup stir failure analysis" >> $GITHUB_STEP_SUMMARY
            echo "4. Review individual test logs in \`.soup/logs/terraform.log\`" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
