[project]
name = "terraform-provider-tofusoup"
dynamic = ["version"]
description = "Terraform provider for TofuSoup registry queries and state inspection"
requires-python = ">=3.11"
readme = "README.md"
license = "Apache-2.0"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = [
    # Floors track the suite releases this provider is actually built and tested
    # against. They sat at >=0.4.0 while the lock resolved 0.6.x, so the published
    # metadata promised a combination nothing had ever run. The pyvider floor
    # sits at 0.6.2 because that is where the generated dev-mode wrapper stopped
    # cd'ing into the install directory: under 0.6.1 and earlier the examples
    # here ran with their working directory silently moved to this checkout, so
    # relative paths and the filesystem state store's default root landed in the
    # provider tree instead of beside the example.
    "pyvider>=0.6.2",
    "tofusoup>=0.6.1",
    "flavorpack>=0.4.6",
    "provide-foundation[all]>=0.4.3",
    # Capped below 1.11 for the packaged build, not for this package's own use.
    # flavorpack downloads wheels with --platform manylinux2014_<arch> (its
    # MANYLINUX_TAG is hardcoded), and jq stopped publishing manylinux2014
    # wheels after 1.10.0 -- 1.11 and 1.12 ship manylinux_2_26/2_28 only. The
    # lock happens to sit at 1.10.0 today, so this pins the luck: a refresh
    # that picked 1.12.0 would fail the Linux PSP build the way it did in
    # terraform-provider-pyvider. Lift once flavorpack asks for a newer tag.
    "jq>=1.9.1,<1.11; sys_platform != 'win32' or platform_machine != 'ARM64'",
    # Floor only. The previous <=46.0.3 cap applied to win32/ARM64, where neither
    # cryptography nor grpcio publishes a wheel (re-checked 2026-08-30: grpcio
    # 1.83.1 ships win32/win_amd64 only, grpc/grpc#39064; cryptography 50.0.1
    # ships win_amd64 only). Since pyvider requires grpcio, that platform cannot
    # install the suite at all, so the cap constrained a resolution that never
    # happens. windows_arm64 is unsupported suite-wide for the same reason.
    "cryptography>=46.0.0; sys_platform == 'win32' and platform_machine == 'ARM64'",
]

[project.urls]
Homepage = "https://foundry.provide.io/terraform-provider-tofusoup"
Documentation = "https://foundry.provide.io/terraform-provider-tofusoup"
Repository = "https://github.com/provide-io/terraform-provider-tofusoup"
Issues = "https://github.com/provide-io/terraform-provider-tofusoup"

[project.scripts]
terraform-provider-tofusoup = "pyvider.cli:main"

[project.entry-points.pyvider]
terraform-provider-tofusoup = "tofusoup.tf.components"

[dependency-groups]
dev = [
    "provide-testkit[standard,advanced-testing,build]>=0.4.0",
    "plating>=0.6.1",
    # provide-foundry>=0.4.0 isn't on PyPI; docs.setup needs it for extract_base_mkdocs
    "provide-foundry>=0.4.0",
]
docs = [
    "provide-testkit[docs]>=0.4.0",
]

[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.ruff]
# `.ci-tooling` is another repository, checked out into the workspace by CI. Its
# files are not ours to restyle, and the wrknv `format.check` task runs
# `ruff format .` across the whole tree -- unlike the scoped invocation used
# locally -- so it walks in and fails Code Quality on files this repository does
# not own. Locally that directory does not exist, which is why the check passes
# here and fails there.
exclude = [".ci-tooling"]
line-length = 111
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "ANN", "B", "C90", "SIM", "PTH", "RUF"]
ignore = ["ANN401", "E501", "C901"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN001", "ANN002", "ANN003", "ANN201", "ANN202", "ANN204", "B017", "BLE001", "C901", "E402", "RUF043", "S105", "S106", "S110", "SIM105"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ""
# Parallel execution: pytest -n <workers> (range: 2-16, recommend: CPU cores or 8, max: 16 to avoid xdist hang)

[tool.pyvider]
# The provider name selects the plugin directory Terraform searches,
# local/providers/<name>/. Unset, it falls back to "pyvider", and this provider
# installs as terraform-provider-pyvider where nothing asks for it: the examples
# here request local/providers/tofusoup, so they resolve whatever else happens to
# sit in the plugin directory -- for a long while, a stale prebuilt binary.
#
# `name` is the documented key as of pyvider 0.6.1, which the floor above
# clears; 0.6.0 read only `provider_name`, so a resolution at that version
# would find no name here and fall back to the default.
name = "tofusoup"
component_packages = ["tofusoup.tf.components"]

[tool.plating]
provider_name = "tofusoup"
output_dir = "docs"

[tool.flavor]
entry_point = "pyvider.cli:main"
output_path = "dist/terraform-provider-tofusoup"
platforms = ["darwin_arm64", "linux_amd64", "linux_arm64", "windows_amd64"]

[tool.flavor.build]
# The oldest Linux this provider is built to run on, stated rather than
# implied. `pip download --platform TAG` replaces the set of tags pip will
# consider and expands each one downward only, so this is both the floor the
# artifact promises (glibc 2.17: CentOS 7, Amazon Linux 2) and the ceiling on
# what a bundled wheel may require.
#
# Listing manylinux2014 alone is deliberate. flavorpack's default also offers
# manylinux_2_28 as a fallback, which lets a package that has stopped
# publishing 2_17 wheels resolve anyway -- convenient, but it silently raises
# the artifact's real floor to whatever that package needs. jq is exactly that
# case: from 1.11 it ships manylinux_2_26/2_28 only, so accepting the fallback
# would produce a provider whose jq extension cannot load on CentOS 7 while
# the build still went green.
#
# With the floor declared here, that combination fails at build time instead,
# naming the tags it asked for. Widen this list only as a deliberate decision
# to stop supporting the older distributions.
manylinux = ["manylinux2014"]
